<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Firma de libros de visita</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='estilos.css') }}"
    />
  </head>
  <body>
    <div class="tarjeta">
      <h1>Firma de libros de visita</h1>
      <form action="/guardar-firma" method="post">
        <label>Tu nombre:</label>
        <input type="text" name="nombre" required /><br />
        <label>Mensaje:</label>
        <textarea name="mensaje" required></textarea><br />
        <button type="submit">Enviar</button>
      </form>
    </div>
  </body>
</html>
